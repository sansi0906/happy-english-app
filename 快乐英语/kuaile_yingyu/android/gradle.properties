org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 保留 daemon：反复构建时省掉每次 JVM 冷启动与全量配置（约 1-2 分钟）
org.gradle.daemon=true
org.gradle.parallel=true
kotlin.incremental=false
android.nonTransitiveRClass=true
# AGP 9 会因项目路径含中文（E:\...\快乐英语\...）直接中断构建，
# 这里显式关闭路径检查；Flutter 自身的资源打包对中文路径是安全的。
android.overridePathCheck=true
# 网络下载超时：连接 30s 快速失败，读超时放到 120s（大 jar 下载期间
# 短暂无数据很常见，20s 会把 50MB 级的构件反复打断重下）
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=120000
# 离线模式置为 false：AGP/Flutter 升级后缓存并不齐，强制离线会让 Gradle
# 在解析依赖阶段长时间空转。仓库已走 settings 里的国内镜像，联网解析更快。
org.gradle.offline=false
