name: 快乐英语 CI

on:
  push:
    branches: [main]
    paths:
      - '快乐英语/kuaile_yingyu/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - '快乐英语/kuaile_yingyu/**'
  workflow_dispatch:

env:
  APP_DIR: 快乐英语/kuaile_yingyu

jobs:
  # 门禁一：内容与音频资源。任何缺图缺音、时长异常、慢速不全都会拦下来。
  asset-gate:
    name: 资源与音频门禁
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 快乐英语/kuaile_yingyu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install --quiet numpy miniaudio imageio-ffmpeg

      - name: 跑资源检查
        run: |
          python tool/check_assets.py > check.json
          tail -n 12 check.json

      - name: 解析结果并卡阈值
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('check.json', encoding='utf-8'))
          fails = []
          if d['problems_total'] != 0:
              fails.append(f"资源问题 {d['problems_total']} 个")
          if d['extra_by_book']:
              fails.append(f"存在未引用资源: {d['extra_by_book']}")
          # 每句都必须有慢速版：慢速文件数与句子数必须相等。
          # 这里用相等判断而不是写死条数，避免新增/删减句子后门禁假红。
          if d['slow_files'] != d['sentences']:
              fails.append(f"慢速文件 {d['slow_files']} 条 ≠ 句子 {d['sentences']} 条")
          mb = d['sizes_MB']
          if mb['images'] > 200:
              fails.append(f"图片体积 {mb['images']}MB 超过 200MB 上限")
          if fails:
              print('\n'.join(fails)); sys.exit(1)
          print(f"OK items={d['items']} sentences={d['sentences']} "
                f"slow={d['slow_files']} images={mb['images']}MB audio={mb['audio']}MB")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-gate-report
          path: 快乐英语/kuaile_yingyu/check.json

  # 门禁二：静态分析 + 单测。注意本机 flutter analyze 会崩，统一用 dart analyze。
  dart-test:
    name: 静态分析与单测
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 快乐英语/kuaile_yingyu
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: 静态分析
        run: dart analyze lib test

      - name: 单测
        run: flutter test --reporter expanded

  # 门禁三：出包。只在门禁一、二都通过后跑，产物可直接下载安装。
  build-apk:
    name: 构建 Release APK
    needs: [asset-gate, dart-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: 快乐英语/kuaile_yingyu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - run: flutter pub get

      # jni 插件走 CMake，需要 NDK 和对应版本的 CMake。
      # runner 不保证预装 CMake 3.22.1，本地能跑通是因为 SDK 里正好有这个版本。
      - name: 准备 NDK 与 CMake
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null 2>&1 || true
          echo "== ndk ==" && ls "$SDK/ndk" || true
          echo "== cmake ==" && ls "$SDK/cmake" || true

      # 插件需要在 pub get 之后打两个兼容补丁：注入阿里云镜像、给 AGP 9
      # 补出插件漏设的 namespace。少了这步，构建会挂在 "Namespace not specified"。
      - name: 修补 pub 缓存插件
        run: python3 tool/patch_pub_cache.py

      # 工程在 ndk.abiFilters 里显式锁定 arm64-v8a，因此必须用 --target-platform，
      # 不能用 --split-per-abi（splits.abi 与 abiFilters 互斥，会直接构建失败）。
      - name: 构建
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log

      # 失败时把根因段落合并成一条 annotation（逐行发会被折叠掉关键信息）
      - name: 失败时输出关键日志
        if: failure()
        shell: bash
        run: |
          W=$(grep -A 14 "What went wrong" build.log 2>/dev/null | head -n 16)
          if [ -z "$W" ]; then W=$(tail -n 25 build.log); fi
          echo "::error::$(echo "$W" | tr '\n' '|' | tr -s ' ')"
          exit 0

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: 快乐英语/kuaile_yingyu/build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: 快乐英语/kuaile_yingyu/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
